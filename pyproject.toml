[project]
name = "lern-mit-teddy"
version = "1.2.0"
description = "Lern mit Teddy — AI German/Arabic language learning voice agent for children. Teddy is a friendly bear who teaches through natural conversation, vocabulary cards, and item-by-item drilling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.27",
    "langchain-openai>=0.3.30",
    "langfuse>=4.6.1",
    "langgraph>=0.6.6",
    "langgraph-cli[inmem]>=0.3.8",
    "livekit>=1.0.12",
    "livekit-agents[openai,silero,turn-detector]~=1.2",
    "faster-whisper>=1.0.3",
    "livekit-plugins-deepgram>=1.2.6",
    "livekit-plugins-google>=1.2.6",
    "livekit-plugins-hume>=1.2.6",
    "livekit-plugins-langchain~=1.1",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-openai>=1.2.6",
    "livekit-plugins-silero>=1.2.6",
    "livekit-plugins-turn-detector>=1.2.6",
    "livekit-plugins-ultravox>=1.5.9",
    "python-dotenv>=1.1.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "edge-tts>=7.3.1",
    "ai-platform-shared",
    "pyjwt[crypto]>=2.10.1",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "mutagen>=1.48.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
    "mlflow>=2.18.0",
    "pypdf>=7.1.1",
    "pymupdf>=2.1",
    "easyocr>=1.7.2",
]

[project.scripts]
voice-frontend = "src.frontend.server:main"
voice-frontend-native = "src.frontend.native_client:main"

[tool.uv.sources]
ai-platform-shared = { git = "https://github.com/umushtaq1990/ai-platform-shared.git", rev = "v0.1.1" }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["e2e: requires the full docker-compose stack running"]
