<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lern mit Teddy — Dein Sprachfreund</title>
    <link rel="stylesheet" href="/static/styles.css?v=4" />
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.5/dist/livekit-client.umd.min.js"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="logo-wrap">
          <span class="logo-icon">🐻</span>
          <h1>Lern mit Teddy</h1>
        </div>
        <p class="subtitle">Sprich mit Teddy und lern eine neue Sprache — einfach und Spaß!</p>
      </header>

      <!-- NAME GATE — shown first; frontend only appears after a name is given
           (or the user logs in, which skips this screen entirely) -->
      <section id="name-gate" class="panel">
        <div class="config-section">
          <label class="config-label" for="input-user-name">What's your name?</label>
          <input type="text" id="input-user-name" class="full-select" placeholder="e.g. Emma" maxlength="40" autocomplete="given-name" />
        </div>
        <div class="actions">
          <button id="btn-name-continue" class="primary start-btn">Continue</button>
        </div>
        <p id="login-divider" class="status hidden">— or —</p>
        <div class="actions">
          <a id="link-login" href="/auth/login" class="hidden">Log in with email</a>
        </div>
      </section>

      <!-- WELCOME / CONFIG PANEL -->
      <section id="welcome" class="panel hidden">

        <p id="login-status" class="status hidden"></p>

        <div class="config-row">
          <!-- Language to learn -->
          <div class="config-section">
            <label class="config-label" for="sel-learn-lang">I want to learn</label>
            <select id="sel-learn-lang" class="full-select">
              <option value="de" selected>🇩🇪 German</option>
              <option value="en">🇬🇧 English</option>
              <option value="hi">🇮🇳 Hindi</option>
              <option value="ar">🇸🇦 Arabic</option>
            </select>
          </div>

          <!-- Native language -->
          <div class="config-section">
            <label class="config-label" for="sel-native-lang">My native language</label>
            <select id="sel-native-lang" class="full-select">
              <option value="en">🇬🇧 English</option>
              <option value="hi">🇮🇳 Hindi</option>
              <option value="de">🇩🇪 German</option>
              <option value="ar">🇸🇦 Arabic</option>
            </select>
          </div>
        </div>

        <!-- Section / theme selector — choose what to learn before starting -->
        <div id="section-bar" class="config-section">
          <label class="config-label section-label" for="sel-section">📚 Lernbereich wählen (optional)</label>
          <select id="sel-section" class="full-select">
            <option value="">🎲 Überrasch mich! (alle Themen)</option>
            <optgroup label="⭐ Level 1 — Grundlagen">
              <option value="greetings">👋 Hallo! (Begrüßung)</option>
              <option value="numbers1">🔢 Zahlen 1–10</option>
              <option value="numbers2">🔢 Zahlen 11–20</option>
              <option value="alphabet">🔤 Das ABC</option>
              <option value="colors">🎨 Farben</option>
            </optgroup>
            <optgroup label="👨‍👩‍👧 Level 2 — Familie &amp; Körper">
              <option value="family">👨‍👩‍👧 Familie</option>
              <option value="body">🫀 Mein Körper</option>
            </optgroup>
            <optgroup label="🏠 Level 3 — Zu Hause">
              <option value="rooms">🏠 Das Haus (Räume)</option>
              <option value="bedroom">🛏️ Schlafzimmer</option>
              <option value="bathroom">🚿 Badezimmer</option>
              <option value="living_room">🛋️ Wohnzimmer</option>
              <option value="kitchen">🍳 Küche</option>
            </optgroup>
            <optgroup label="🌿 Level 4 — Natur">
              <option value="garden">🌳 Garten</option>
              <option value="weather">🌤️ Wetter</option>
              <option value="seasons">🍂 Jahreszeiten</option>
              <option value="animals">🐾 Tiere</option>
            </optgroup>
            <optgroup label="🍕 Level 5 — Essen &amp; Trinken">
              <option value="breakfast">🍳 Frühstück</option>
              <option value="fruits">🍎 Obst</option>
              <option value="vegetables">🥕 Gemüse</option>
              <option value="drinks">🥛 Getränke</option>
              <option value="food">🍕 Lieblingsessen</option>
              <option value="icecream">🍦 Eis</option>
            </optgroup>
            <optgroup label="🎒 Level 6 — Welt &amp; Schule">
              <option value="school">📚 Schule</option>
              <option value="transport">🚗 Transport &amp; Verkehr</option>
              <option value="sports">⚽ Sport &amp; Spiele</option>
              <option value="hobbies">🎨 Hobbys</option>
            </optgroup>
            <optgroup label="👗 Level 7 — Gesellschaft">
              <option value="clothes">👕 Kleidung</option>
              <option value="jobs">👨‍⚕️ Berufe</option>
              <option value="toys">🧸 Spielzeug</option>
              <option value="superpower">🦸 Superkräfte</option>
            </optgroup>
          </select>
        </div>

        <div class="actions">
          <button id="btn-start" class="primary start-btn">🎙️ Let's Chat!</button>
        </div>
        <p id="status" class="status">Ready — choose a language and click Let's Chat!</p>
      </section>

      <!-- ACTIVE SESSION PANEL -->
      <section id="session" class="panel hidden">

        <!-- Teddy — absolute upper-right corner -->
        <div id="character-wrap">
          <svg id="lingua-bear" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="52"  cy="52"  r="30" fill="#B8734A"/>
            <circle cx="52"  cy="52"  r="18" fill="#E8B89A"/>
            <circle cx="168" cy="52"  r="30" fill="#B8734A"/>
            <circle cx="168" cy="52"  r="18" fill="#E8B89A"/>
            <circle cx="110" cy="110" r="85" fill="#D4956A"/>
            <circle cx="80"  cy="90"  r="14" fill="#2C1810"/>
            <circle cx="85"  cy="85"  r="5"  fill="white"/>
            <circle cx="140" cy="90"  r="14" fill="#2C1810"/>
            <circle cx="145" cy="85"  r="5"  fill="white"/>
            <ellipse id="blink-left"  cx="80"  cy="90"  rx="14" ry="0" fill="#D4956A"/>
            <ellipse id="blink-right" cx="140" cy="90"  rx="14" ry="0" fill="#D4956A"/>
            <ellipse cx="60"  cy="118" rx="16" ry="9"  fill="#FF9999" opacity="0.35"/>
            <ellipse cx="160" cy="118" rx="16" ry="9"  fill="#FF9999" opacity="0.35"/>
            <ellipse cx="110" cy="140" rx="34" ry="26" fill="#E8C4A0"/>
            <ellipse cx="110" cy="128" rx="11" ry="8"  fill="#2C1810"/>
            <ellipse id="bear-mouth"  cx="110" cy="153" rx="15" ry="5"  fill="#2C1810"/>
          </svg>
          <div id="char-state-label">Hallo!</div>
        </div>

        <div class="session-header">
          <div class="session-meta">
            <span id="lang-label" class="badge lang-badge"></span>
          </div>
          <button id="btn-end" class="danger">End Session</button>
        </div>

        <!-- Vocabulary cards — full width, shown when agent asks about a topic -->
        <div id="vocab-panel" class="hidden">
          <div id="vocab-title"></div>
          <div id="vocab-cards"></div>
        </div>

        <div id="messages" class="messages" aria-live="polite">
          <div class="msg system">Deine Stunde beginnt — Teddy begrüßt dich gleich!</div>
        </div>

        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" placeholder="Type in any language…" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
        <audio id="agent-audio" autoplay></audio>
      </section>
    </main>

    <!-- FEEDBACK MODAL -->
    <div id="feedback-overlay" class="overlay hidden">
      <div class="modal">
        <h2>How was your lesson?</h2>
        <p class="modal-sub">Dein Feedback hilft Teddy besser zu werden!</p>
        <div class="thumb-row">
          <button id="btn-thumbs-up" class="thumb-btn" title="Great!">👍</button>
          <button id="btn-thumbs-down" class="thumb-btn" title="Needs improvement">👎</button>
        </div>
        <textarea id="feedback-comment" class="feedback-textarea" placeholder="Any comments? (optional)" rows="3"></textarea>
        <div class="modal-actions">
          <button id="btn-submit-feedback" class="primary" disabled>Submit</button>
          <button id="btn-skip-feedback" class="ghost">Skip</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js?v=10"></script>
  </body>
</html>
